apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-rp
  namespace: radius-system
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      labels:
        radplanes.local/executor: management-only
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: local-terraform-layout
          # The installer substitutes only this field with the inspected executor image.
          image: EXECUTOR_IMAGE
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -ec
            - |
              target=/terraform
              binary=/opt/radplanes/terraform
              global="$target/.terraform-global"
              reject_link() {
                if [ -L "$1" ]; then echo "Refusing symlinked Terraform path: $1" >&2; exit 1; fi
              }
              # A restarted Pod reuses this emptyDir. Without DAC_OVERRIDE, root must
              # reclaim each managed path first and must not recurse into runtime files.
              reject_link "$target"
              chown 0:0 "$target"
              reject_link "$global"
              mkdir -p "$global"
              chown 0:0 "$global"
              for path in "$global/terraform" "$target/terraform" "$global/.terraform-ready"; do
                reject_link "$path"
                if [ -e "$path" ]; then chown 0:0 "$path"; fi
              done
              cp "$binary" "$global/terraform"
              cp "$binary" "$target/terraform"
              touch "$global/.terraform-ready"
              chmod 0700 "$target" "$global"
              chown 65532:65532 "$global/terraform" "$target/terraform" \
                "$global/.terraform-ready" "$global" "$target"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: terraform
              mountPath: /terraform
      containers:
        - name: dynamic-rp
          imagePullPolicy: Never
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DOCKER_HOST
              value: unix:///run/radplanes/docker.sock
            - name: RADIUS_LOGGING_LEVEL
              value: error
          volumeMounts:
            - name: local-docker
              mountPath: /run/radplanes/docker.sock
      volumes:
        - name: local-docker
          hostPath:
            path: /run/radplanes/docker.sock
            type: Socket
