# Synthetic POC: agentgateway with PreRouting and PostRouting filter policies.
# Host ports come from the project's reserved block (ports.env); nothing binds defaults.
name: agw-filters-demo

x-app: &app
  build: .
  image: agw-filters-demo-app:local
  environment:
    REDIS_URL: redis://redis:6379/0
    PASSPORT_SECRET: synthetic-demo-passport-secret
  depends_on: [redis]

services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896
    command: ["-f", "/config/config.yaml"]
    volumes: ["./config.yaml:/config/config.yaml:ro"]
    ports: ["127.0.0.1:35521:3000"]
    depends_on: [filters, azure-models, vendor-models]

  filters:
    <<: *app
    command: ["python", "filters.py"]

  azure-models:
    <<: *app
    command: ["python", "models.py"]
    environment: {PROVIDER: azure-hosted, PORT: "9101"}
    depends_on: []

  vendor-models:
    <<: *app
    command: ["python", "models.py"]
    environment: {PROVIDER: vendor-hosted, PORT: "9102"}
    depends_on: []

  reconcilers:
    <<: *app
    command: ["python", "reconcilers.py"]
    ports: ["127.0.0.1:35522:9200"]

  redis:
    image: docker.io/library/redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
